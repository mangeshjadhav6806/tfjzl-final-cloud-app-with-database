<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Online Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 32rem">
    <h1 class="h2 mb-4">Learner sign in</h1>
    <form method="post" class="bg-white border rounded p-4">
        {% csrf_token %}
        {% if form.errors %}<p class="text-danger" role="alert">Username or password is incorrect.</p>{% endif %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input class="form-control" id="id_username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
