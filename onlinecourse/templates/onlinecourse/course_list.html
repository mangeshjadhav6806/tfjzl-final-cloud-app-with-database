<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <h1 class="display-6 mb-4">Online courses</h1>
    <div class="list-group">
        {% for course in courses %}
            <a class="list-group-item list-group-item-action p-4" href="{% url 'course_details' course.id %}">
                <h2 class="h5">{{ course.name }}</h2>
                <p class="mb-0 text-secondary">{{ course.description }}</p>
            </a>
        {% empty %}
            <p class="text-secondary">No courses have been published yet.</p>
        {% endfor %}
    </div>
</main>
</body>
</html>
